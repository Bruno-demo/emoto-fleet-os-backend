<svg width="100%" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; rx: 10; }
    .title { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    .line { stroke: #475569; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .label { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
  </style>

  <!-- Clients -->
  <rect class="box" x="40" y="30" width="160" height="50" />
  <text class="title" x="120" y="48" text-anchor="middle">Dashboard</text>
  <text class="subtitle" x="120" y="65" text-anchor="middle">Next.js</text>

  <rect class="box" x="220" y="30" width="160" height="50" />
  <text class="title" x="300" y="48" text-anchor="middle">Rider App</text>
  <text class="subtitle" x="300" y="65" text-anchor="middle">Expo</text>

  <rect class="box" x="400" y="30" width="180" height="50" />
  <text class="title" x="490" y="48" text-anchor="middle">Partner Clients</text>
  <text class="subtitle" x="490" y="65" text-anchor="middle">Insurer API</text>

  <!-- API Gateway -->
  <rect class="box" x="300" y="110" width="200" height="50" />
  <text class="title" x="400" y="128" text-anchor="middle">API Gateway</text>
  <text class="subtitle" x="400" y="145" text-anchor="middle">Auth, CORS, WS proxy</text>

  <!-- Core API -->
  <rect class="box" x="300" y="190" width="200" height="50" />
  <text class="title" x="400" y="208" text-anchor="middle">Fleet API</text>
  <text class="subtitle" x="400" y="225" text-anchor="middle">NestJS</text>

  <!-- Ingestion Worker -->
  <rect class="box" x="40" y="190" width="200" height="50" />
  <text class="title" x="140" y="208" text-anchor="middle">Ingestion Worker</text>
  <text class="subtitle" x="140" y="225" text-anchor="middle">MQTT -> DB/Redis</text>

  <!-- Stream Processor -->
  <rect class="box" x="560" y="190" width="200" height="50" />
  <text class="title" x="660" y="208" text-anchor="middle">Stream Processor</text>
  <text class="subtitle" x="660" y="225" text-anchor="middle">Redis Streams</text>

  <!-- MQTT Layer -->
  <rect class="box" x="40" y="270" width="200" height="50" />
  <text class="title" x="140" y="288" text-anchor="middle">EMQX MQTT</text>
  <text class="subtitle" x="140" y="305" text-anchor="middle">Telemetry + Commands</text>

  <rect class="box" x="40" y="350" width="200" height="50" />
  <text class="title" x="140" y="368" text-anchor="middle">Devices</text>
  <text class="subtitle" x="140" y="385" text-anchor="middle">E-Moto Units</text>

  <!-- Data Layer -->
  <rect class="box" x="300" y="270" width="200" height="50" />
  <text class="title" x="400" y="288" text-anchor="middle">Postgres + Timescale</text>
  <text class="subtitle" x="400" y="305" text-anchor="middle">Fleet + Telemetry</text>

  <rect class="box" x="300" y="330" width="200" height="50" />
  <text class="title" x="400" y="348" text-anchor="middle">Redis</text>
  <text class="subtitle" x="400" y="365" text-anchor="middle">Cache + Live State</text>

  <rect class="box" x="300" y="390" width="200" height="50" />
  <text class="title" x="400" y="408" text-anchor="middle">MinIO</text>
  <text class="subtitle" x="400" y="425" text-anchor="middle">Evidence Packs</text>

  <!-- Observability -->
  <rect class="box" x="560" y="270" width="200" height="50" />
  <text class="title" x="660" y="288" text-anchor="middle">Monitoring</text>
  <text class="subtitle" x="660" y="305" text-anchor="middle">Prometheus + Grafana</text>

  <!-- Connections -->
  <line class="line" x1="120" y1="80" x2="340" y2="110" />
  <line class="line" x1="300" y1="80" x2="400" y2="110" />
  <line class="line" x1="490" y1="80" x2="460" y2="110" />

  <line class="line" x1="400" y1="160" x2="400" y2="190" />

  <line class="line" x1="140" y1="240" x2="140" y2="270" />
  <line class="line" x1="140" y1="320" x2="140" y2="350" />
  <line class="line" x1="240" y1="215" x2="300" y2="215" />

  <line class="line" x1="400" y1="240" x2="400" y2="270" />
  <line class="line" x1="400" y1="240" x2="400" y2="330" />
  <line class="line" x1="400" y1="240" x2="400" y2="390" />

  <line class="line" x1="500" y1="350" x2="560" y2="215" />
  <line class="line" x1="500" y1="350" x2="560" y2="290" />

  <text class="label" x="610" y="250">Stream reads</text>
</svg>
