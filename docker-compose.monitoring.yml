services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/emoto-fleet-overview.json
    ports:
      - '${GRAFANA_PORT:-3005}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana-dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  loki:
    image: grafana/loki:2.9.5
    restart: unless-stopped
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto
    profiles: ['logging']

  promtail:
    image: grafana/promtail:2.9.5
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9080/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto
    profiles: ['logging']

volumes:
  prometheus_data:
  grafana_data:

networks:
  emoto:
    name: emoto
