services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  emqx:
    image: emqx/emqx:5.8.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'emqx ctl status']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - emoto

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto
    profiles: ['storage']

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do
          echo "Waiting for MinIO...";
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-emoto-evidence};
        /usr/bin/mc anonymous set private local/${S3_BUCKET:-emoto-evidence};
    restart: 'no'
    networks:
      - emoto
    profiles: ['storage']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MQTT_DISABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MQTT_DISABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    command: ['node', 'apps/api/dist/src/worker.js']
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    networks:
      - emoto

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_API_URL: http://api:3000
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  stream-processor:
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    env_file:
      - .env.prod
    environment:
      STREAM_REDIS_URL: redis://redis:6379
      STREAM_KEY: telemetry:stream
      STREAM_GROUP: telemetry-processors
      STREAM_POLL_MS: 1000
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emoto

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      BACKUP_LOOP: 'true'
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
    volumes:
      - postgres_backups:/backups
      - ./ops/backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ['/bin/sh', '/backup/backup.sh']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emoto

volumes:
  postgres_data:
  redis_data:
  minio_data:
  postgres_backups:

networks:
  emoto:
    name: emoto
    driver: bridge
