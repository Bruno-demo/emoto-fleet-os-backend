services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  emqx:
    image: emqx/emqx:5.8.4
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '${EMQX_DASHBOARD_PORT:-18083}:18083'
    healthcheck:
      test: ['CMD-SHELL', 'emqx ctl status']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - emoto

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto
    profiles: ['storage']

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin}; do
          echo "Waiting for MinIO...";
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-emoto-evidence};
        /usr/bin/mc anonymous set private local/${S3_BUCKET:-emoto-evidence};
    restart: 'no'
    networks:
      - emoto
    profiles: ['storage']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emoto

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      BACKUP_LOOP: 'true'
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
    volumes:
      - postgres_backups:/backups
      - ./ops/backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ['/bin/sh', '/backup/backup.sh']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emoto

volumes:
  postgres_data:
  redis_data:
  minio_data:
  postgres_backups:

networks:
  emoto:
    name: emoto
    driver: bridge
