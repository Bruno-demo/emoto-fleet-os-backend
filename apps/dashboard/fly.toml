app = "emoto-dashboard"
primary_region = "iad"

[build]
  dockerfile = "apps/dashboard/Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[[services]]
  http_service = true
  internal_port = 3001
  processes = ["app"]

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "10s"
    grace_period = "15s"
    method = "get"
    path = "/"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false
